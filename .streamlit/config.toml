[theme]
# ── Colours ───────────────────────────────────────────────────────────────────
# Accent: used for buttons, sliders, active widget borders, links
primaryColor        = "#2563EB"   # Blue-600

# Main canvas background
backgroundColor     = "#FFFFFF"   # Pure white

# Sidebar, expanders, code blocks, metric cards, dataframe header
secondaryBackgroundColor = "#F1F5F9"   # Slate-100 — soft but clearly distinct

# Body text, headings, labels
textColor           = "#0F172A"   # Slate-900 — near-black, maximum readability

# ── Font ──────────────────────────────────────────────────────────────────────
font = "sans serif"
