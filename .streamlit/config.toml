[theme]
primaryColor             = "#0891B2"   # cyan-600  — buttons, sliders, links
backgroundColor          = "#F0F4F8"   # slate-100 — main canvas
secondaryBackgroundColor = "#FFFFFF"   # white     — sidebar, containers, inputs
textColor                = "#1E293B"   # slate-900 — primary text
font                     = "sans serif"
